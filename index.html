<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLOW SURVIVAL - SOUND & SAVE</title>
    <style>
        body { 
            margin: 0; background: #000; color: #fff; font-family: sans-serif; 
            overflow: hidden; touch-action: none; 
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        #ui-layer { position: absolute; z-index: 100; width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center; }
        .menu-box { 
            position: relative; background: rgba(0,0,0,0.9); padding: 35px; border: 2px solid #fff; 
            border-radius: 15px; pointer-events: auto; text-align: center; min-width: 280px;
        }
        .settings-top { position: absolute; top: 10px; padding: 15px; min-width: 300px; }
        h1 { font-size: 32px; letter-spacing: 5px; margin: 0 0 10px; text-shadow: 0 0 15px #fff; }
        .btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 12px; margin: 5px; cursor: pointer; width: 220px; font-weight: bold; }
        .btn:hover { background: #fff; color: #000; }
        .settings-btn { position: absolute; right: 10px; bottom: 10px; width: auto; padding: 4px 8px; font-size: 10px; border-color: #555; color: #888; }
        .ctrl-btn { 
            position: absolute; background: #222; border: 3px solid #555; border-radius: 50%; 
            pointer-events: auto; opacity: 0.1; z-index: 50; display: flex; 
            align-items: center; justify-content: center; font-weight: bold; color: #888; user-select: none;
        }
        .setting-active { opacity: 0.8 !important; border-color: #0ff !important; color: #fff; cursor: move; }
        #scoreBoard { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 110; pointer-events: none; display: none; }
        #scoreNum { font-size: 32px; font-weight: bold; }
        canvas { background: #000; display: block; }
    </style>
</head>
<body>

<div id="scoreBoard"><div id="scoreNum">0</div></div>

<div id="ui-layer">
    <div id="titleScreen" class="menu-box">
        <h1>GLOW<br>SURVIVAL</h1>
        <div id="bestText" style="color: #fb0; font-size: 16px; margin-bottom: 20px; font-weight: bold;">BEST: 0</div>
        <button class="btn" onclick="G.start(13)">START: SMALL</button><br>
        <button class="btn" onclick="G.start(19)">START: MEDIUM</button><br>
        <button class="btn" onclick="G.start(25)">START: LARGE</button>
        <button class="btn settings-btn" onclick="G.openSettings()">SETTINGS</button>
    </div>
    <div id="settingsScreen" class="menu-box settings-top" style="display:none;">
        <h3 style="margin: 0;">CONTROLS</h3>
        <p style="font-size: 10px; color: #888;">ドラッグで移動 / スライダーでサイズ</p>
        <input type="range" min="40" max="150" id="sizeRange" style="width:200px; margin: 10px 0;" oninput="G.updateBtnSize(this.value)">
        <br>
        <button class="btn" style="width: 140px; padding: 8px; font-size: 12px;" onclick="G.saveSettings()">SAVE & EXIT</button>
    </div>
    <div id="overScreen" class="menu-box" style="display:none;">
        <h1 style="color:#f00;">DESTROYED</h1>
        <p id="resultScore" style="font-size: 24px; margin: 10px 0;"></p>
        <button class="btn" onclick="G.showTitle()">TITLE</button>
    </div>
</div>

<div id="btn-up" class="ctrl-btn" data-dir="up">W</div>
<div id="btn-left" class="ctrl-btn" data-dir="left">A</div>
<div id="btn-down" class="ctrl-btn" data-dir="down">S</div>
<div id="btn-right" class="ctrl-btn" data-dir="right">D</div>

<canvas id="gameCanvas"></canvas>

<script>
// --- サウンドエンジン ---
const Sound = {
    ctx: new (window.AudioContext || window.webkitAudioContext)(),
    play(freq, type, duration, vol=0.1) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    },
    move() { this.play(440, 'sine', 0.1, 0.05); },
    warn() { this.play(880, 'sine', 0.1, 0.05); },
    fire() { this.play(150, 'sawtooth', 0.3, 0.15); },
    item() { this.play(660, 'square', 0.2, 0.05); this.play(880, 'square', 0.3, 0.05); },
    fever() { [440, 554, 659, 880].forEach((f,i) => setTimeout(()=>this.play(f, 'sine', 0.4, 0.1), i*100)); },
    dead() { this.play(100, 'sawtooth', 1.0, 0.2); }
};

const G = {
    state: "title", score: 0, 
    highScore: 0,
    shake: 0, difficulty: 0, lasers: [], missions: [], popups: [], particles: [],
    spawnT: 0, fever: 0, slow: 0, peace: 0, angle: 0, targetAngle: 0, rotT: 0,
    config: JSON.parse(localStorage.getItem("gs_elite_config_v5")) || {
        size: 70, pos: {
            up: {x: 100, y: window.innerHeight - 240}, down: {x: 100, y: window.innerHeight - 100},
            left: {x: 20, y: window.innerHeight - 170}, right: {x: 180, y: window.innerHeight - 170}
        }
    },
    moveDir: null, moveCool: 0,

    init() {
        this.cvs = document.getElementById("gameCanvas"); this.ctx = this.cvs.getContext("2d");
        // ハイスコア読み込み
        const savedBest = localStorage.getItem("GS_ELITE_BEST_RECORD");
        this.highScore = savedBest ? parseInt(savedBest) : 0;
        
        this.applyConfig(); this.setupControls(); this.showTitle(); this.tick();
    },
    applyConfig() {
        document.getElementById("sizeRange").value = this.config.size;
        ["up","down","left","right"].forEach(d => {
            const b = document.getElementById("btn-" + d);
            b.style.width = b.style.height = this.config.size + "px";
            b.style.fontSize = (this.config.size * 0.4) + "px";
            b.style.left = this.config.pos[d].x + "px"; b.style.top = this.config.pos[d].y + "px";
        });
    },
    updateBtnSize(v) { this.config.size = parseInt(v); this.applyConfig(); },
    setupControls() {
        let dragTarget = null, offX = 0, offY = 0;
        const onStart = (e) => {
            if (this.state === "settings") {
                dragTarget = e.target; const touch = e.touches ? e.touches[0] : e;
                const r = e.target.getBoundingClientRect();
                offX = touch.clientX - r.left; offY = touch.clientY - r.top;
                e.preventDefault();
            } else if (this.state === "playing") {
                this.moveDir = e.target.getAttribute("data-dir");
            }
        };
        const onMove = (e) => {
            if (dragTarget && this.state === "settings") {
                const touch = e.touches ? e.touches[0] : e;
                dragTarget.style.left = (touch.clientX - offX) + "px"; dragTarget.style.top = (touch.clientY - offY) + "px";
                e.preventDefault();
            }
        };
        const onEnd = () => {
            if (dragTarget) {
                const r = dragTarget.getBoundingClientRect();
                this.config.pos[dragTarget.getAttribute("data-dir")] = { x: r.left, y: r.top };
                dragTarget = null;
            }
            this.moveDir = null; this.moveCool = 0;
        };
        document.querySelectorAll('.ctrl-btn').forEach(b => {
            b.addEventListener("mousedown", onStart); b.addEventListener("touchstart", onStart, {passive:false});
        });
        window.addEventListener("mousemove", onMove); window.addEventListener("touchmove", onMove, {passive:false});
        window.addEventListener("mouseup", onEnd); window.addEventListener("touchend", onEnd);
        
        window.addEventListener("keydown", e => {
            if (this.state !== "playing") return;
            const k = e.key.toLowerCase();
            if (k === "w" || k === "arrowup") this.moveDir = "up";
            if (k === "s" || k === "arrowdown") this.moveDir = "down";
            if (k === "a" || k === "arrowleft") this.moveDir = "left";
            if (k === "d" || k === "arrowright") this.moveDir = "right";
        });
        window.addEventListener("keyup", e => { this.moveDir = null; this.moveCool = 0; });
    },
    openSettings() {
        this.state = "settings"; document.getElementById("titleScreen").style.display = "none";
        document.getElementById("settingsScreen").style.display = "block";
        document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.add('setting-active'));
    },
    saveSettings() { localStorage.setItem("gs_elite_config_v5", JSON.stringify(this.config)); this.showTitle(); },
    showTitle() {
        this.state = "title"; document.getElementById("titleScreen").style.display = "block";
        document.getElementById("settingsScreen").style.display = "none"; document.getElementById("overScreen").style.display = "none";
        document.getElementById("scoreBoard").style.display = "none";
        document.getElementById("bestText").innerText = "BEST: " + Math.floor(this.highScore);
        document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('setting-active'));
        this.angle = this.targetAngle = 0; this.resize(19);
    },
    start(size) {
        Sound.ctx.resume(); // 音声開始
        this.resize(size); this.state = "playing"; this.score = 0; this.difficulty = 0; this.lasers = []; this.missions = []; this.popups = []; this.particles = [];
        this.fever = 0; this.slow = 0; this.peace = 0; this.angle = this.targetAngle = 0; this.rotT = 0;
        document.getElementById("titleScreen").style.display = "none"; document.getElementById("scoreBoard").style.display = "block";
        const mid = this.paths[Math.floor(this.paths.length / 2)];
        this.player = { gx: mid, gy: mid, rx: mid, ry: mid };
        this.spawnNewMissionSet();
    },
    resize(size) {
        this.rows = this.cols = size; const base = Math.min(window.innerWidth * 0.95, window.innerHeight * 0.7);
        this.tileSize = base / size; const dpr = window.devicePixelRatio || 1;
        this.cvs.width = (this.cols * this.tileSize) * dpr; this.cvs.height = (this.rows * this.tileSize) * dpr;
        this.cvs.style.width = (this.cols * this.tileSize) + "px"; this.cvs.style.height = (this.rows * this.tileSize) + "px";
        this.ctx.scale(dpr, dpr); this.paths = []; for (let i = 3; i <= size - 4; i += 2) this.paths.push(i);
    },
    spawnNewMissionSet() {
        const r = Math.random();
        if (r < 0.5) this.spawnItem("green"); else if (r < 0.8) { for(let i=0; i<3; i++) this.spawnItem("blue"); } else this.spawnItem("purple");
    },
    spawnItem(type) {
        this.missions.push({ t: type, x: this.paths[Math.floor(Math.random()*this.paths.length)], y: this.paths[Math.floor(Math.random()*this.paths.length)], c: {green:"#0F0", yellow:"#FF0", blue:"#0AF", purple:"#F0F"}[type] });
    },
    addPopup(v, x, y) { this.popups.push({ x, y, v, l: 40 }); },
    addParticles(x, y, c, n) { for(let i=0; i<n; i++) this.particles.push({ x, y, c, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, l:30 }); },
    spawnLaser() {
        if (this.peace > 0) return;
        const activeV = this.lasers.filter(l => l.v).map(l => l.p);
        const activeH = this.lasers.filter(l => !l.v).map(l => l.p);
        const isV = Math.random() > 0.5;
        const targetPaths = (isV ? this.paths.filter(p => !activeV.includes(p)) : this.paths.filter(p => !activeH.includes(p)));
        if (targetPaths.length === 0) return;
        const p = targetPaths[Math.floor(Math.random() * targetPaths.length)];
        const r = Math.random(); const baseW = (this.slow > 0) ? 80 : 40;
        
        Sound.warn(); // 警告音

        if (this.score >= 10000 && r < 0.2) { 
            this.lasers.push({ c: "#FFF", v: isV, p, t: 0, w: 90 }, { c: "#FFF", v: !isV, p: this.paths[0], t: 0, w: 90 });
        } else if (this.score >= 7000 && r < 0.5) { 
            const idx = this.paths.indexOf(p); const n = idx < this.paths.length - 1 ? this.paths[idx + 1] : this.paths[idx - 1];
            this.lasers.push({ c: "#F0F", v: isV, p, t: 0, w: 65 }, { c: "#F0F", v: isV, p: n, t: 0, w: 65 });
        } else { this.lasers.push({ c: "#F00", v: isV, p, t: 0, w: 40 }); }
    },
    move(dx, dy) {
        if (this.state !== "playing") return;
        const nx = this.player.gx + dx, ny = this.player.gy + dy;
        if (nx >= 2 && nx <= this.cols - 3 && ny >= 2 && ny <= this.rows - 3 && !(nx % 2 === 0 && ny % 2 === 0)) {
            this.player.gx = nx; this.player.gy = ny;
            Sound.move();
        }
    },
    update() {
        if (this.state === "title") { if (Math.random() < 0.03) this.spawnLaser(); }
        else if (this.state === "playing") {
            this.difficulty = Math.min(1.0, this.score / 50000); this.score += 0.2;
            if (this.fever > 0) this.fever--; if (this.slow > 0) this.slow--; if (this.peace > 0) this.peace--;
            if (this.score >= 15000) {
                this.rotT++; if (this.rotT > 550) { this.targetAngle += (Math.random()>0.5?1:-1)*Math.PI/2; this.rotT = 0; this.shake = 10; }
            }
            this.angle += (this.targetAngle - this.angle) * 0.05;
            if (this.moveDir && this.moveCool <= 0) {
                const d = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[this.moveDir];
                this.move(d[0], d[1]); this.moveCool = 9;
            }
            if (this.moveCool > 0) this.moveCool--;
            this.missions.forEach((m, i) => {
                if (this.player.gx === m.x && this.player.gy === m.y) {
                    const px = m.x * this.tileSize, py = m.y * this.tileSize;
                    this.missions.splice(i, 1); this.addParticles(px, py, m.c, 15); this.shake = 10;
                    if (m.t === "green") { this.score += 200; this.addPopup("+200", px, py); this.spawnItem("yellow"); Sound.item(); }
                    else if (m.t === "yellow") { this.score += 1000; this.addPopup("FEVER", px, py); this.fever = 150; this.lasers = []; this.spawnNewMissionSet(); this.shake = 25; Sound.fever(); }
                    else if (m.t === "blue") { this.score += 300; this.addPopup("+300", px, py); Sound.item(); if (!this.missions.some(mi => mi.t === "blue")) { this.peace = 200; this.score += 1000; this.addPopup("PEACE", px, py); this.spawnNewMissionSet(); Sound.fever(); } }
                    else if (m.t === "purple") { this.score += 500; this.addPopup("SLOW", px, py); this.slow = 240; this.spawnNewMissionSet(); Sound.item(); }
                }
            });
            this.player.rx += (this.player.gx - this.player.rx) * 0.25; this.player.ry += (this.player.gy - this.player.ry) * 0.25;
            if (++this.spawnT > Math.max(10, 45 - (this.difficulty * 35))) { this.spawnLaser(); this.spawnT = 0; }
        }
        this.lasers.forEach((l, i) => {
            const oldT = l.t; l.t++;
            if (oldT === l.w) { this.shake = 12; Sound.fire(); }
            if (this.state === "playing" && l.t > l.w && this.fever <= 0) {
                if ((l.v && this.player.gx === l.p) || (!l.v && this.player.gy === l.p)) {
                    this.endGame();
                }
            }
            if (l.t > l.w + 12) this.lasers.splice(i, 1);
        });
        this.popups.forEach((p, i) => { p.y -= 1; p.l--; if (p.l <= 0) this.popups.splice(i, 1); });
        this.particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.l--; if (p.l <= 0) this.particles.splice(i, 1); });
        this.shake *= 0.9;
        if (this.state === "playing") document.getElementById("scoreNum").innerText = Math.floor(this.score);
    },
    endGame() {
        this.state = "gameover"; this.shake = 35; Sound.dead();
        if (this.score > this.highScore) { 
            this.highScore = this.score; 
            localStorage.setItem("GS_ELITE_BEST_RECORD", Math.floor(this.highScore)); 
        }
        document.getElementById("overScreen").style.display = "block";
        document.getElementById("resultScore").innerText = "SCORE: " + Math.floor(this.score);
    },
    draw() {
        const ctx = this.ctx; ctx.save();
        const cx = (this.cols * this.tileSize) / 2, cy = (this.rows * this.tileSize) / 2;
        if (this.shake > 1) ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
        ctx.translate(cx, cy); ctx.rotate(this.angle); ctx.translate(-cx, -cy);
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, this.cols * this.tileSize, this.rows * this.tileSize);
        for (let r = 2; r < this.rows - 2; r++) {
            for (let c = 2; c < this.cols - 2; c++) {
                if (!(c % 2 === 0 && r % 2 === 0)) { ctx.fillStyle = "#111"; ctx.fillRect(c * this.tileSize + 1, r * this.tileSize + 1, this.tileSize - 2, this.tileSize - 2); }
            }
        }
        this.missions.forEach(m => { ctx.fillStyle = m.c; ctx.fillRect(m.x * this.tileSize + 6, m.y * this.tileSize + 6, this.tileSize - 12, this.tileSize - 12); });
        this.lasers.forEach(l => {
            if (l.t <= l.w) {
                const a = (Math.sin(l.t*0.2)+1)/2; ctx.strokeStyle = l.c; ctx.lineWidth = 4; ctx.globalAlpha = a; ctx.beginPath();
                if (l.v) { ctx.moveTo(l.p*this.tileSize+5, this.tileSize*2); ctx.lineTo((l.p+1)*this.tileSize-5, this.tileSize*2); ctx.moveTo(l.p*this.tileSize+5, (this.rows-2)*this.tileSize); ctx.lineTo((l.p+1)*this.tileSize-5, (this.rows-2)*this.tileSize); }
                else { ctx.moveTo(this.tileSize*2, l.p*this.tileSize+5); ctx.lineTo(this.tileSize*2, (l.p+1)*this.tileSize-5); ctx.moveTo((this.cols-2)*this.tileSize, l.p*this.tileSize+5); ctx.lineTo((this.cols-2)*this.tileSize, (l.p+1)*this.tileSize-5); }
                ctx.stroke(); ctx.globalAlpha = 1;
            } else { ctx.fillStyle = l.c; ctx.shadowBlur = 15; ctx.shadowColor = l.c; if (l.v) ctx.fillRect(l.p * this.tileSize + 6, 0, this.tileSize - 12, this.rows * this.tileSize); else ctx.fillRect(0, l.p * this.tileSize + 6, this.cols * this.tileSize, this.tileSize - 12); ctx.shadowBlur = 0; }
        });
        if (this.state === "playing") {
            ctx.fillStyle = this.fever > 0 ? "#0FF" : "#FFF"; ctx.shadowBlur = 20; ctx.shadowColor = ctx.fillStyle;
            const s = this.tileSize * 0.75, px = this.player.rx * this.tileSize + (this.tileSize - s) / 2, py = this.player.ry * this.tileSize + (this.tileSize - s) / 2;
            ctx.beginPath(); ctx.moveTo(px+3, py); ctx.lineTo(px+s-3, py); ctx.arcTo(px+s, py, px+s, py+3, 3); ctx.lineTo(px+s, py+s-3); ctx.arcTo(px+s, py+s, px+s-3, py+s, 3); ctx.lineTo(px+3, py+s); ctx.arcTo(px, py+s, px, py+s-3, 3); ctx.lineTo(px, py+3); ctx.arcTo(px, py, px+3, py, 3); ctx.fill();
        }
        this.popups.forEach(p => { ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.fillText(p.v, p.x, p.y); });
        ctx.restore();
    },
    tick() { this.update(); this.draw(); requestAnimationFrame(() => this.tick()); }
};
G.init();
</script>
</body>
</html>
